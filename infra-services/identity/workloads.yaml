apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: openldap
  namespace: identity
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: openldap
  namespace: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: openldap
  template:
    metadata:
      labels:
        app: openldap
    spec:
      containers:
      - name: openldap
        image: docker.io/vegardit/openldap:2.6.10@sha256:a6ef0b528b889880a861c44995c5d6c91a972216f1a878857689aa9789ee24d6
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 192Mi
        ports:
        - containerPort: 389
        env:
        - name: LDAP_INIT_ORG_DN
          value: dc=k8slab,dc=lab
        - name: LDAP_INIT_ORG_NAME
          value: K8S Lab
        - name: LDAP_INIT_ROOT_USER_DN
          value: uid=admin,dc=k8slab,dc=lab
        - name: LDAP_INIT_ROOT_USER_PW_FILE
          value: /run/secrets/ldap-admin-password
        - name: LDAP_BACKUP_TIME
          value: ''
        volumeMounts:
        - name: data
          mountPath: /var/lib/ldap
          subPath: data
        - name: data
          mountPath: /etc/ldap/slapd.d
          subPath: config
        - name: bootstrap
          mountPath: /opt/ldifs/init_org_entries.ldif
          subPath: entries.ldif
          readOnly: true
        - name: password
          mountPath: /run/secrets
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 20
        livenessProbe:
          tcpSocket:
            port: 389
          initialDelaySeconds: 60
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: openldap
      - name: bootstrap
        secret:
          secretName: ldap-bootstrap
      - name: password
        secret:
          secretName: ldap-admin
      automountServiceAccountToken: false
---
apiVersion: v1
kind: Service
metadata:
  name: openldap
  namespace: identity
spec:
  selector:
    app: openldap
  ports:
  - port: 389
    targetPort: 389
---
