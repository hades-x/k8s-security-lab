apiVersion: apps/v1
kind: Deployment
metadata:
  name: keycloak
  namespace: identity
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: keycloak
  template:
    metadata:
      labels:
        app: keycloak
    spec:
      containers:
      - name: keycloak
        image: quay.io/keycloak/keycloak:26.8.0
        args:
        - start-dev
        - --import-realm
        resources:
          requests:
            cpu: 200m
            memory: 384Mi
          limits:
            cpu: 1500m
            memory: 640Mi
        ports:
        - containerPort: 8080
        - containerPort: 9000
        env:
        - name: KC_DB
          value: dev-file
        - name: KC_HOSTNAME
          value: https://keycloak.192.168.150.200.sslip.io
        - name: KC_HTTP_ENABLED
          value: 'true'
        - name: KC_PROXY_HEADERS
          value: xforwarded
        - name: KC_HEALTH_ENABLED
          value: 'true'
        - name: KC_BOOTSTRAP_ADMIN_USERNAME
          value: lab-kc-admin
        - name: JAVA_OPTS_KC_HEAP
          value: -Xms128m -Xmx384m
        envFrom:
        - secretRef:
            name: keycloak-env
        volumeMounts:
        - name: data
          mountPath: /opt/keycloak/data
        - name: realm
          mountPath: /opt/keycloak/data/import
          readOnly: true
        readinessProbe:
          httpGet:
            path: /health/ready
            port: 9000
          initialDelaySeconds: 20
        startupProbe:
          httpGet:
            path: /health/started
            port: 9000
          failureThreshold: 60
          periodSeconds: 10
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: keycloak
      - name: realm
        configMap:
          name: keycloak-realm
      securityContext:
        fsGroup: 1000
---
apiVersion: v1
kind: Service
metadata:
  name: keycloak
  namespace: identity
spec:
  selector:
    app: keycloak
  ports:
  - port: 8080
    targetPort: 8080
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: keycloak
  namespace: identity
spec:
  secretName: keycloak-tls
  dnsNames:
  - keycloak.192.168.150.200.sslip.io
  duration: 24h
  renewBefore: 8h
  issuerRef:
    name: lab-acme
    kind: ClusterIssuer
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: keycloak
  namespace: identity
spec:
  ingressClassName: traefik
  tls:
  - hosts:
    - keycloak.192.168.150.200.sslip.io
    secretName: keycloak-tls
  rules:
  - host: keycloak.192.168.150.200.sslip.io
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: keycloak
            port:
              number: 8080
