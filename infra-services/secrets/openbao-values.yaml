global:
  tlsDisable: true
injector:
  enabled: false
server:
  image:
    tag: 2.7.1
  dev:
    enabled: false
  standalone:
    enabled: true
    config: "ui = true\nlistener \"tcp\" {\n tls_disable = 1\n address = \"[::]:8200\"\
      \n}\nstorage \"raft\" {\n path = \"/openbao/data\"\n node_id = \"openbao-0\"\
      \n}\ncluster_addr = \"http://openbao-0.openbao-internal:8201\"\n"
  ha:
    enabled: false
  dataStorage:
    enabled: true
    size: 2Gi
    storageClass: local-path
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 300m
      memory: 256Mi
  readinessProbe:
    enabled: true
ui:
  enabled: false
