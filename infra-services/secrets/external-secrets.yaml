apiVersion: v1
kind: ServiceAccount
metadata:
  name: eso-openbao
  namespace: secrets
---
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: lab-openbao
spec:
  provider:
    vault:
      server: http://openbao.secrets.svc.cluster.local:8200
      path: kv
      version: v2
      auth:
        kubernetes:
          mountPath: kubernetes
          role: eso-demo
          serviceAccountRef:
            name: eso-openbao
            namespace: secrets
            audiences:
            - openbao
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: demo
  namespace: secrets
spec:
  refreshInterval: 1m
  secretStoreRef:
    name: lab-openbao
    kind: ClusterSecretStore
  target:
    name: demo-synced
    creationPolicy: Owner
  data:
  - secretKey: message
    remoteRef:
      key: demo
      property: message
