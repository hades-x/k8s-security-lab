apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: data
  namespace: drill
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 128Mi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: data
  namespace: drill
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: data
  template:
    metadata:
      labels:
        app: data
      annotations:
        backup.velero.io/backup-volumes: data
    spec:
      containers:
      - name: data
        image: docker.io/library/busybox:1.37.0
        command:
        - sh
        - -c
        - while true; do echo lab-drill-heartbeat; sleep 10; done
        resources:
          requests:
            cpu: 10m
            memory: 8Mi
          limits:
            cpu: 100m
            memory: 32Mi
        volumeMounts:
        - name: data
          mountPath: /data
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: data
