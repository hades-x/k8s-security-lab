apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: garage
  namespace: s3
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 15Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: garage
  namespace: s3
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: garage
  template:
    metadata:
      labels:
        app: garage
    spec:
      containers:
      - name: garage
        image: docker.io/dxflrs/garage:v2.4.1@sha256:9c96caa2612d3411acc5b0e6701fb238dbfba33e533a6d7d3d811a4b12d0d020
        command:
        - /garage
        args:
        - server
        - --single-node
        - --default-bucket
        resources:
          requests:
            cpu: 50m
            memory: 96Mi
          limits:
            cpu: 300m
            memory: 256Mi
        ports:
        - containerPort: 3900
        env:
        - name: GARAGE_DEFAULT_BUCKET
          value: velero
        - name: GARAGE_DEFAULT_ACCESS_KEY
          valueFrom:
            secretKeyRef:
              name: garage-credentials
              key: access-key
        - name: GARAGE_DEFAULT_SECRET_KEY
          valueFrom:
            secretKeyRef:
              name: garage-credentials
              key: secret-key
        volumeMounts:
        - name: data
          mountPath: /var/lib/garage
        - name: config
          mountPath: /etc/garage.toml
          subPath: garage.toml
          readOnly: true
        readinessProbe:
          tcpSocket:
            port: 3900
          initialDelaySeconds: 10
        livenessProbe:
          tcpSocket:
            port: 3900
          initialDelaySeconds: 40
      volumes:
      - name: data
        persistentVolumeClaim:
          claimName: garage
      - name: config
        secret:
          secretName: garage-config
---
apiVersion: v1
kind: Service
metadata:
  name: garage
  namespace: s3
spec:
  selector:
    app: garage
  ports:
  - port: 3900
    targetPort: 3900
