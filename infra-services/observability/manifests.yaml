apiVersion: v1
kind: ConfigMap
metadata:
  name: lab-root
  namespace: monitoring
data:
  root_ca.crt: 'REGENERATE_LAB_TRUST_MATERIAL

    '
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: grafana
  namespace: monitoring
spec:
  secretName: grafana-tls
  dnsNames:
  - grafana.192.168.150.200.sslip.io
  duration: 24h
  renewBefore: 8h
  issuerRef:
    name: lab-acme
    kind: ClusterIssuer
---
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: lab-alerts
  namespace: monitoring
spec:
  groups:
  - name: lab.rules
    rules:
    - alert: LabNodeNotReady
      expr: kube_node_status_condition{condition="Ready",status="true"} == 0
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: LabNodeNotReady
    - alert: LabPodCrashLooping
      expr: max_over_time(kube_pod_container_status_waiting_reason{reason="CrashLoopBackOff"}[5m])
        >= 1
      for: 2m
      labels:
        severity: warning
      annotations:
        summary: LabPodCrashLooping
    - alert: LabKafkaConsumerLagHigh
      expr: sum by (consumergroup,topic) (kafka_consumergroup_lag) > 10000
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: LabKafkaConsumerLagHigh
    - alert: LabPVCAlmostFull
      expr: kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes
        < 0.10
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: LabPVCAlmostFull
    - alert: LabCertificateExpiring
      expr: certmanager_certificate_expiration_timestamp_seconds - time() < 43200
      for: 5m
      labels:
        severity: warning
      annotations:
        summary: LabCertificateExpiring
    - alert: LabP3AcceptanceAlwaysFiring
      expr: vector(1)
      for: 0m
      labels:
        severity: warning
        k8slab_phase: p3-test
      annotations:
        summary: Intentional disposable-lab acceptance alert; remove after training.
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata:
  name: step-cert-manager
  namespace: monitoring
spec:
  namespaceSelector:
    matchNames:
    - cert-manager
  selector:
    matchLabels:
      app.kubernetes.io/name: cert-manager
      app.kubernetes.io/component: controller
  endpoints:
  - port: http-metrics
    interval: 30s
