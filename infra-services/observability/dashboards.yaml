apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cluster
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  cluster.json: '{"title": "Lab cluster", "uid": "lab-cluster", "schemaVersion": 39,
    "version": 1, "editable": true, "refresh": "30s", "panels": [{"id": 1, "title":
    "Ready nodes", "type": "timeseries", "datasource": {"type": "prometheus", "uid":
    "prometheus"}, "targets": [{"refId": "A", "expr": "sum(kube_node_status_condition{condition=\"Ready\",status=\"true\"})"}],
    "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}}, {"id": 2, "title": "CPU by namespace",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "sum by(namespace)(rate(container_cpu_usage_seconds_total{container!=\"\"}[5m]))"}],
    "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}}, {"id": 3, "title": "PVC free ratio",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "kubelet_volume_stats_available_bytes / kubelet_volume_stats_capacity_bytes"}],
    "gridPos": {"h": 8, "w": 12, "x": 12, "y": 8}}]}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-kafka
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  kafka.json: '{"title": "Lab kafka", "uid": "lab-kafka", "schemaVersion": 39, "version":
    1, "editable": true, "refresh": "30s", "panels": [{"id": 1, "title": "Consumer
    lag", "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "sum by(consumergroup,topic)(kafka_consumergroup_lag)"}],
    "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}}, {"id": 2, "title": "Kafka up",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "kafka_brokers"}], "gridPos": {"h": 8, "w":
    12, "x": 0, "y": 8}}]}'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: dashboard-cilium-hubble
  namespace: monitoring
  labels:
    grafana_dashboard: '1'
data:
  cilium-hubble.json: '{"title": "Lab cilium-hubble", "uid": "lab-cilium-hubble",
    "schemaVersion": 39, "version": 1, "editable": true, "refresh": "30s", "panels":
    [{"id": 1, "title": "Cilium drops", "type": "timeseries", "datasource": {"type":
    "prometheus", "uid": "prometheus"}, "targets": [{"refId": "A", "expr": "sum by(reason)(rate(cilium_drop_count_total[5m]))"}],
    "gridPos": {"h": 8, "w": 12, "x": 12, "y": 0}}, {"id": 2, "title": "Hubble flows",
    "type": "timeseries", "datasource": {"type": "prometheus", "uid": "prometheus"},
    "targets": [{"refId": "A", "expr": "sum by(verdict)(rate(hubble_flows_processed_total[5m]))"}],
    "gridPos": {"h": 8, "w": 12, "x": 0, "y": 8}}]}'
