deploymentMode: SingleBinary
loki:
  image:
    tag: 3.6.12
  auth_enabled: false
  commonConfig:
    replication_factor: 1
  storage:
    type: filesystem
  schemaConfig:
    configs:
    - from: '2026-01-01'
      store: tsdb
      object_store: filesystem
      schema: v13
      index:
        prefix: index_
        period: 24h
  limits_config:
    retention_period: 48h
    ingestion_rate_mb: 2
    ingestion_burst_size_mb: 4
    max_query_parallelism: 2
  compactor:
    retention_enabled: true
    delete_request_store: filesystem
  querier:
    max_concurrent: 2
singleBinary:
  replicas: 1
  resources:
    requests:
      cpu: 100m
      memory: 192Mi
    limits:
      cpu: 1000m
      memory: 256Mi
  persistence:
    enabled: true
    storageClass: local-path
    size: 5Gi
read:
  replicas: 0
write:
  replicas: 0
backend:
  replicas: 0
gateway:
  enabled: false
chunksCache:
  enabled: false
resultsCache:
  enabled: false
lokiCanary:
  enabled: false
test:
  enabled: false
sidecar:
  rules:
    enabled: false
