grafana:
  admin:
    existingSecret: grafana-admin
    userKey: admin-user
    passwordKey: admin-password
  resources:
    requests:
      cpu: 50m
      memory: 96Mi
    limits:
      cpu: 300m
      memory: 384Mi
  persistence:
    enabled: true
    type: pvc
    storageClassName: local-path
    size: 1Gi
  initChownData:
    enabled: false
  envFromSecret: grafana-oidc
  ingress:
    enabled: true
    ingressClassName: traefik
    hosts:
    - grafana.192.168.150.200.sslip.io
    tls:
    - hosts:
      - grafana.192.168.150.200.sslip.io
      secretName: grafana-tls
  sidecar:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 128Mi
    dashboards:
      enabled: true
      label: grafana_dashboard
      labelValue: '1'
      searchNamespace: monitoring
    datasources:
      enabled: true
  extraConfigmapMounts:
  - name: lab-root
    mountPath: /etc/lab
    configMap: lab-root
    readOnly: true
  grafana.ini:
    server:
      root_url: https://grafana.192.168.150.200.sslip.io
    auth.generic_oauth:
      enabled: true
      name: Keycloak
      allow_sign_up: true
      client_id: grafana
      client_secret: $__env{GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET}
      scopes: openid profile email groups
      auth_url: https://keycloak.192.168.150.200.sslip.io/realms/lab/protocol/openid-connect/auth
      token_url: https://keycloak.192.168.150.200.sslip.io/realms/lab/protocol/openid-connect/token
      api_url: https://keycloak.192.168.150.200.sslip.io/realms/lab/protocol/openid-connect/userinfo
      use_pkce: true
      tls_client_ca: /etc/lab/root_ca.crt
      role_attribute_path: contains(groups[*], 'lab-admins') && 'Admin' || 'Viewer'
      role_attribute_strict: true
      login_attribute_path: preferred_username
  additionalDataSources:
  - name: Loki
    type: loki
    uid: loki
    access: proxy
    url: http://loki.monitoring.svc.cluster.local:3100
prometheus:
  prometheusSpec:
    retention: 2d
    retentionSize: 8GB
    resources:
      requests:
        cpu: 200m
        memory: 384Mi
      limits:
        cpu: 1500m
        memory: 1024Mi
    storageSpec:
      volumeClaimTemplate:
        spec:
          accessModes:
          - ReadWriteOnce
          storageClassName: local-path
          resources:
            requests:
              storage: 10Gi
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false
    scrapeInterval: 30s
alertmanager:
  alertmanagerSpec:
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 300m
        memory: 96Mi
prometheusOperator:
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 300m
      memory: 160Mi
  prometheusConfigReloader:
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
  admissionWebhooks:
    patch:
      resources:
        requests:
          cpu: 50m
          memory: 16Mi
        limits:
          cpu: 300m
          memory: 48Mi
kube-state-metrics:
  resources:
    requests:
      cpu: 50m
      memory: 32Mi
    limits:
      cpu: 300m
      memory: 96Mi
prometheus-node-exporter:
  resources:
    requests:
      cpu: 50m
      memory: 16Mi
    limits:
      cpu: 300m
      memory: 48Mi
kubeEtcd:
  enabled: false
kubeControllerManager:
  enabled: false
kubeScheduler:
  enabled: false
kubeProxy:
  enabled: false
defaultRules:
  rules:
    etcd: false
    kubeControllerManager: false
    kubeSchedulerAlerting: false
    kubeSchedulerRecording: false
    kubeProxy: false
kubelet:
  serviceMonitor:
    metricRelabelings:
    - action: drop
      sourceLabels:
      - __name__
      - le
      regex: (csi_operations|storage_operation_duration)_seconds_bucket;(0.25|2.5|15|25|120|600)(\.0)?
    - action: keep
      sourceLabels:
      - __name__
      regex: (kubelet|storage_operation|csi|rest_client|process|go)_.+
kubeApiServer:
  serviceMonitor:
    metricRelabelings:
    - action: drop
      regex: (etcd_request|apiserver_request_slo|apiserver_request_sli|apiserver_request)_duration_seconds_bucket;(0\.15|0\.2|0\.3|0\.35|0\.4|0\.45|0\.6|0\.7|0\.8|0\.9|1\.25|1\.5|1\.75|2|3|3\.5|4|4\.5|6|7|8|9|15|20|40|45|50)(\.0)?
      sourceLabels:
      - __name__
      - le
    - action: keep
      sourceLabels:
      - __name__
      regex: (apiserver|process|go)_.+
