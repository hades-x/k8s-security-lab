apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-acme
spec:
  acme:
    server: https://step-ca.pki.svc.cluster.local/acme/acme/directory
    email: admin@k8slab.lab
    caBundle: REGENERATE_LAB_CA_BUNDLE
    privateKeySecretRef:
      name: lab-acme-account
    solvers:
    - http01:
        ingress:
          ingressClassName: traefik
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: lab-ca
spec:
  ca:
    secretName: lab-ca-intermediate
---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: acme-test
  namespace: pki
spec:
  secretName: acme-test-tls
  dnsNames:
  - acme-test.192.168.150.200.sslip.io
  duration: 24h
  renewBefore: 8h
  issuerRef:
    name: lab-acme
    kind: ClusterIssuer
