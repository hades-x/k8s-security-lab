apiVersion: v1
kind: ResourceQuota
metadata:
  name: workload-budget
  namespace: demo
spec:
  hard:
    requests.cpu: '4'
    requests.memory: 4Gi
    limits.cpu: '8'
    limits.memory: 8Gi
    pods: '30'
    persistentvolumeclaims: '10'
---
apiVersion: v1
kind: LimitRange
metadata:
  name: workload-budget
  namespace: demo
spec:
  limits:
  - type: Container
    min:
      cpu: 5m
      memory: 8Mi
---
