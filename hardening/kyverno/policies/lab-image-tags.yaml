apiVersion: kyverno.io/v1
kind: ClusterPolicy
metadata:
  name: lab-image-tags
  annotations:
    pod-policies.kyverno.io/autogen-controllers: none
spec:
  validationFailureAction: Audit
  background: true
  rules:
  - name: no-latest-or-implicit
    match:
      any:
      - resources:
          kinds:
          - Pod
          namespaces:
          - demo
          - dev
          - staging
          - prod
          - scen-*
    validate:
      message: Use an explicit non-latest tag or digest
      foreach:
      - list: request.object.spec.[containers, initContainers, ephemeralContainers][]
        deny:
          conditions:
            any:
            - key: '{{ regex_match(''^[^@]+:latest(@.*)?$'', element.image) }}'
              operator: Equals
              value: true
            - key: '{{ regex_match(''^([^@]+:[^/:]+|[^@]+@sha256:[a-f0-9]{64})$'',
                element.image) }}'
              operator: Equals
              value: false
