name: Offline candidate checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: offline-${{ github.ref }}
  cancel-in-progress: true
jobs:
  offline:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0, official tag verified
        with:
          persist-credentials: false
      - name: Standard-library local-equivalent gate
        run: make ci
