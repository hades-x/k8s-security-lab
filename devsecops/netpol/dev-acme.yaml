apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: p6-acme-solver
  namespace: dev
spec:
  ingress:
  - from:
    - namespaceSelector:
        matchLabels:
          kubernetes.io/metadata.name: kube-system
      podSelector:
        matchLabels:
          app.kubernetes.io/name: traefik
    ports:
    - port: 8089
  podSelector:
    matchLabels:
      acme.cert-manager.io/http01-solver: 'true'
  policyTypes:
  - Ingress
