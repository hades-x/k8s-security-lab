apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: p6-cnpg-apiserver
  namespace: prod
spec:
  egress:
  - toEntities:
    - kube-apiserver
    toPorts:
    - ports:
      - port: '6443'
        protocol: TCP
      - port: '443'
        protocol: TCP
  endpointSelector:
    matchLabels:
      cnpg.io/cluster: demo-db
