apiVersion: v1
kind: Pod
metadata:
  name: image
  namespace: ex-debug
  labels:
    exercise: phase-f
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  terminationGracePeriodSeconds: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: main
    image: docker.io/library/busybox:ex-nonexistent-phase-f-20261013
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - echo fixed-image; sleep 480
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 4Mi
