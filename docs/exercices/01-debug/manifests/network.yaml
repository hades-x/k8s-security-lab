apiVersion: v1
kind: Pod
metadata:
  name: server
  namespace: ex-debug
  labels:
    app: debug-server
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  terminationGracePeriodSeconds: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: main
    image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - mkdir -p /tmp/www; echo netpol-ok >/tmp/www/index.html; exec httpd -f -p 8080
      -h /tmp/www
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
    readinessProbe:
      httpGet:
        path: /
        port: 8080
      periodSeconds: 2
  volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 4Mi
---
apiVersion: v1
kind: Pod
metadata:
  name: client
  namespace: ex-debug
  labels:
    app: debug-client
spec:
  automountServiceAccountToken: false
  restartPolicy: Always
  terminationGracePeriodSeconds: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: main
    image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - sleep 480
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 4Mi
---
apiVersion: v1
kind: Service
metadata:
  name: server
  namespace: ex-debug
spec:
  selector:
    app: debug-server
  ports:
  - port: 8080
    targetPort: 8080
