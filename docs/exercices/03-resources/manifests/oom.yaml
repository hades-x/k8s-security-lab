apiVersion: v1
kind: Pod
metadata:
  name: oom
  namespace: ex-resources
  labels:
    exercise: phase-f
spec:
  automountServiceAccountToken: false
  restartPolicy: Never
  terminationGracePeriodSeconds: 2
  securityContext:
    runAsNonRoot: true
    runAsUser: 1000
    runAsGroup: 1000
    seccompProfile:
      type: RuntimeDefault
  containers:
  - name: main
    image: docker.io/library/busybox:1.37.0@sha256:bdf57e528e45e4433820e045b29b4597825a1c9e38353532d90a01445013f82e
    imagePullPolicy: IfNotPresent
    command:
    - sh
    - -c
    - echo allocating-inside-64Mi-cgroup; exec awk 'BEGIN { x=sprintf("%1048576s","x");
      for(i=0;i<160;i++){a[i]=x i; print i; system("sleep 0.02")} system("sleep 5")
      }'
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
        - ALL
    resources:
      requests:
        cpu: 10m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 64Mi
    volumeMounts:
    - name: tmp
      mountPath: /tmp
  volumes:
  - name: tmp
    emptyDir:
      sizeLimit: 4Mi
