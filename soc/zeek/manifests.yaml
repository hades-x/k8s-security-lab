apiVersion: v1
kind: Namespace
metadata:
  name: soc-sensors
  labels:
    pod-security.kubernetes.io/enforce: privileged
    pod-security.kubernetes.io/enforce-version: v1.35
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: zeek
  namespace: soc-sensors
spec:
  selector:
    matchLabels:
      app: zeek
  template:
    metadata:
      labels:
        app: zeek
    spec:
      hostNetwork: true
      dnsPolicy: ClusterFirstWithHostNet
      automountServiceAccountToken: false
      tolerations:
      - operator: Exists
      initContainers:
      - name: tap-init
        image: docker.io/library/alpine:3.22.2@sha256:4b7ce07002c69e8f3d704a9c5d6fd3053be500b7f1c69fc0d80990c2ad8dd412
        command:
        - /bin/sh
        - -ec
        - apk add --no-cache iproute2=6.15.0-r0; ip link show zeektap0 >/dev/null
          2>&1 || ip link add zeektap0 type veth peer name zeektap0-in; ip link set
          zeektap0 address 02:00:00:fe:00:01; ip link set zeektap0-in address 02:00:00:fe:00:02;
          ip link set zeektap0 up; ip link set zeektap0-in up; ip link set zeektap0
          promisc on
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_ADMIN
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: '1'
            memory: 96Mi
      containers:
      - name: live
        image: docker.io/zeek/zeek:9.0.0@sha256:70733f4e540ba1608e37e00c6a93d009f79734262c9ec2ba09d90aa9abc16de5
        command:
        - /bin/sh
        - -ec
        - mkdir -p /streams/live; cd /streams/live; exec zeek -C -i ${NODE_INTERFACE}
          /scripts/main.zeek
        env:
        - name: NODE_INTERFACE
          value: enp1s0
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_RAW
            - NET_ADMIN
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: intel
          mountPath: /intel
          readOnly: true
        - name: streams
          mountPath: /streams
          readOnly: false
      - name: tap
        image: docker.io/zeek/zeek:9.0.0@sha256:70733f4e540ba1608e37e00c6a93d009f79734262c9ec2ba09d90aa9abc16de5
        command:
        - /bin/sh
        - -ec
        - mkdir -p /streams/tap; cd /streams/tap; exec zeek -C -i zeektap0 /scripts/main.zeek
        env:
        - name: NODE_INTERFACE
          value: enp1s0
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
            add:
            - NET_RAW
            - NET_ADMIN
        resources:
          requests:
            cpu: 200m
            memory: 256Mi
          limits:
            cpu: '1'
            memory: 512Mi
        volumeMounts:
        - name: scripts
          mountPath: /scripts
          readOnly: true
        - name: intel
          mountPath: /intel
          readOnly: true
        - name: streams
          mountPath: /streams
          readOnly: false
      - name: log-merger
        image: docker.io/library/python:3.13.9-alpine3.22@sha256:e5fa639e49b85986c4481e28faa2564b45aa8021413f31026c3856e5911618b1
        command:
        - python3
        - /scripts/merge-logs.py
        resources:
          requests:
            cpu: 20m
            memory: 32Mi
          limits:
            cpu: '1'
            memory: 128Mi
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        volumeMounts:
        - name: scripts
          mountPath: /scripts
        - name: streams
          mountPath: /streams
        - name: logs
          mountPath: /var/log/zeek/current
        lifecycle:
          preStop:
            exec:
              command:
              - /bin/sh
              - -c
              - sleep 10
      volumes:
      - name: scripts
        configMap:
          name: zeek-scripts
      - name: intel
        configMap:
          name: zeek-intel
      - name: streams
        emptyDir:
          sizeLimit: 2Gi
      - name: logs
        hostPath:
          path: /var/log/zeek/current
          type: DirectoryOrCreate
      terminationGracePeriodSeconds: 30
