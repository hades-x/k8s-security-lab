apiVersion: kafka.strimzi.io/v1
kind: KafkaUser
metadata:
  name: zeek-shipper
  namespace: kafka
  labels:
    strimzi.io/cluster: soc
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
    - resource:
        type: topic
        name: zeek-
        patternType: prefix
      operations:
      - Write
      - Describe
      host: '*'
  quotas:
    producerByteRate: 1048576
    consumerByteRate: 1024
    requestPercentage: 25
---
