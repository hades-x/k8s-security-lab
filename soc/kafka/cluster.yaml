apiVersion: kafka.strimzi.io/v1
kind: KafkaNodePool
metadata:
  name: mixed
  namespace: kafka
  labels:
    strimzi.io/cluster: soc
spec:
  replicas: 3
  roles:
  - broker
  - controller
  storage:
    type: persistent-claim
    size: 10Gi
    class: local-path
    deleteClaim: false
  resources:
    requests:
      memory: 1Gi
      cpu: 250m
    limits:
      memory: 1536Mi
      cpu: 1500m
  jvmOptions:
    -Xms: 768m
    -Xmx: 768m
  template:
    pod:
      metadata:
        labels:
          soc.lab/role: kafka-broker
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      affinity:
        podAntiAffinity:
          requiredDuringSchedulingIgnoredDuringExecution:
          - labelSelector:
              matchLabels:
                soc.lab/role: kafka-broker
            topologyKey: kubernetes.io/hostname
---
apiVersion: kafka.strimzi.io/v1
kind: Kafka
metadata:
  name: soc
  namespace: kafka
spec:
  kafka:
    version: 4.3.1
    metadataVersion: 4.3-IV0
    image: quay.io/strimzi/kafka:1.3.0-kafka-4.3.1@sha256:1f189b1f0f32684302d8b018b1d21b411e2469a9c465fbdc18fa3599cb5bbdad
    listeners:
    - name: tls
      port: 9093
      type: internal
      tls: true
      authentication:
        type: scram-sha-512
    authorization:
      type: simple
    config:
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2
      auto.create.topics.enable: false
      log.retention.hours: 24
      log.retention.bytes: 268435456
      log.segment.bytes: 67108864
      num.partitions: 3
  entityOperator:
    topicOperator:
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 256Mi
          cpu: 500m
      jvmOptions:
        -Xms: 64m
        -Xmx: 128m
    userOperator:
      resources:
        requests:
          memory: 128Mi
          cpu: 100m
        limits:
          memory: 256Mi
          cpu: 500m
      jvmOptions:
        -Xms: 64m
        -Xmx: 128m
    template:
      pod:
        tolerations:
        - key: node-role.kubernetes.io/control-plane
          operator: Exists
          effect: NoSchedule
        - key: node-role.kubernetes.io/master
          operator: Exists
          effect: NoSchedule
