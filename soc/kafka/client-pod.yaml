apiVersion: v1
kind: Pod
metadata:
  name: soc-kafka-proof
  namespace: kafka
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  tolerations:
  - key: node-role.kubernetes.io/control-plane
    operator: Exists
    effect: NoSchedule
  - key: node-role.kubernetes.io/master
    operator: Exists
    effect: NoSchedule
  containers:
  - name: client
    image: quay.io/strimzi/kafka:1.3.0-kafka-4.3.1@sha256:1f189b1f0f32684302d8b018b1d21b411e2469a9c465fbdc18fa3599cb5bbdad
    command:
    - /bin/bash
    - -ec
    - sleep 1800
    resources:
      requests:
        memory: 128Mi
        cpu: 50m
      limits:
        memory: 512Mi
        cpu: 500m
    env:
    - name: KAFKA_HEAP_OPTS
      value: -Xms64m -Xmx256m
    volumeMounts:
    - name: ca
      mountPath: /ca
      readOnly: true
    - name: producer
      mountPath: /producer
      readOnly: true
    - name: consumer
      mountPath: /consumer
      readOnly: true
    - name: config
      mountPath: /proof
      readOnly: true
  volumes:
  - name: ca
    secret:
      secretName: soc-cluster-ca-cert
      items:
      - key: ca.crt
        path: ca.crt
  - name: producer
    secret:
      secretName: zeek-shipper
      items:
      - key: password
        path: password
  - name: consumer
    secret:
      secretName: soc-indexer
      items:
      - key: password
        path: password
  - name: config
    configMap:
      name: soc-kafka-proof
