apiVersion: v1
kind: Pod
metadata:
  name: falco-kafka-acceptance
  namespace: kafka
spec:
  restartPolicy: Never
  automountServiceAccountToken: false
  containers:
  - name: consumer
    image: quay.io/strimzi/kafka:1.3.0-kafka-4.3.1@sha256:1f189b1f0f32684302d8b018b1d21b411e2469a9c465fbdc18fa3599cb5bbdad
    command:
    - bash
    - /scripts/kafka-consume.sh
    env:
    - name: KAFKA_HEAP_OPTS
      value: -Xms32m -Xmx128m
    - name: FALCO_PROOF
      value: REPLACED_BY_TEST_SCRIPT
    resources:
      requests:
        cpu: 50m
        memory: 128Mi
      limits:
        cpu: '1'
        memory: 384Mi
    volumeMounts:
    - name: ca
      mountPath: /ca
      readOnly: true
    - name: consumer
      mountPath: /consumer
      readOnly: true
    - name: scripts
      mountPath: /scripts
      readOnly: true
    readinessProbe:
      exec:
        command:
        - bash
        - -ec
        - test -f /tmp/consumer-ready
      periodSeconds: 1
      failureThreshold: 90
  volumes:
  - name: ca
    secret:
      secretName: soc-cluster-ca-cert
  - name: consumer
    secret:
      secretName: soc-indexer
  - name: scripts
    configMap:
      name: falco-kafka-acceptance
