title: Forbidden secret access
id: f7fa01cb-e03a-5ca5-8072-b601a0e24353
status: experimental
description: Synthetic in-lab denied Secret reads by scenario identities; detects
  attempts, never successful credential access.
author: K8S-LAB phase E
date: '2026-10-13'
tags:
- attack.credential-access
- attack.t1552.007
logsource:
  product: kubernetes
  service: audit
detection:
  selection:
    verb:
    - get
    - list
    objectRef.resource: secrets
    objectRef.namespace|startswith: scen-
    responseStatus.code: 403
  condition: selection
falsepositives:
- Intentional lab RBAC negative tests.
level: medium
