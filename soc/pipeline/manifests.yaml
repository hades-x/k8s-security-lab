apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-indexer
  namespace: kafka
data:
  vector.yaml: "data_dir: /var/lib/vector\napi:\n  enabled: true\n  address: 0.0.0.0:8686\n\
    sources:\n  kafka:\n    type: kafka\n    bootstrap_servers: soc-kafka-bootstrap.kafka.svc.cluster.local:9093\n\
    \    sasl:\n      enabled: true\n      mechanism: SCRAM-SHA-512\n      username:\
    \ soc-indexer\n      password: ${KAFKA_PASSWORD}\n    tls:\n      enabled: true\n\
    \      ca_file: /etc/kafka-ca/ca.crt\n      verify_certificate: true\n      verify_hostname:\
    \ true\n    group_id: soc-indexer\n    topics:\n    - zeek-conn\n    - zeek-dns\n\
    \    - zeek-http\n    - zeek-notice\n    - zeek-intel\n    - audit-k8s\n    -\
    \ falco-alerts\n    auto_offset_reset: earliest\n    topic_key: kafka_topic\n\
    \    decoding:\n      codec: json\n    librdkafka_options:\n      auto.commit.interval.ms:\
    \ '1000'\n      queued.max.messages.kbytes: '32768'\n      fetch.message.max.bytes:\
    \ '1048576'\ntransforms:\n  index_route:\n    type: remap\n    inputs:\n    -\
    \ kafka\n    drop_on_error: true\n    drop_on_abort: true\n    source: |\n   \
    \   topic = string!(.kafka_topic)\n      if !includes([\"zeek-conn\", \"zeek-dns\"\
    , \"zeek-http\", \"zeek-notice\", \"zeek-intel\",\n                    \"audit-k8s\"\
    , \"falco-alerts\"], topic) { abort }\n      .index_prefix = topic\n      # Arbitrary\
    \ audit bodies have incompatible dotted label/FieldsV1 keys.\n      # Preserve\
    \ non-secret bodies as JSON strings, not dynamic mapping trees.\n      if topic\
    \ == \"audit-k8s\" {\n        if .objectRef.resource == \"secrets\" {\n      \
    \    del(.requestObject)\n          del(.responseObject)\n        } else {\n \
    \         if exists(.requestObject) { .request_object_json = encode_json(del(.requestObject))\
    \ }\n          if exists(.responseObject) { .response_object_json = encode_json(del(.responseObject))\
    \ }\n        }\n      }\n      if !exists(.\"@timestamp\") { .\"@timestamp\" =\
    \ now() }\n  topic_routes:\n    type: route\n    inputs:\n    - index_route\n\
    \    route:\n      zeek_conn: .kafka_topic == \"zeek-conn\"\n      zeek_dns: .kafka_topic\
    \ == \"zeek-dns\"\n      zeek_http: .kafka_topic == \"zeek-http\"\n      zeek_notice:\
    \ .kafka_topic == \"zeek-notice\"\n      zeek_intel: .kafka_topic == \"zeek-intel\"\
    \n      audit_k8s: .kafka_topic == \"audit-k8s\"\n      falco_alerts: .kafka_topic\
    \ == \"falco-alerts\"\nsinks:\n  zeek_conn:\n    type: elasticsearch\n    inputs:\n\
    \    - topic_routes.zeek_conn\n    endpoints:\n    - https://soc.opensearch.svc.cluster.local:9200\n\
    \    api_version: v7\n    mode: bulk\n    bulk:\n      action: index\n      index:\
    \ zeek-conn-%Y.%m.%d\n    auth:\n      strategy: basic\n      user: soc-indexer\n\
    \      password: ${OPENSEARCH_PASSWORD}\n    tls:\n      ca_file: /etc/opensearch-ca/ca.crt\n\
    \      verify_certificate: true\n      verify_hostname: true\n    compression:\
    \ none\n    buffer:\n      type: disk\n      max_size: 268435488\n      when_full:\
    \ block\n    acknowledgements:\n      enabled: true\n    healthcheck:\n      enabled:\
    \ true\n    suppress_type_name: true\n    request_retry_partial: true\n  zeek_dns:\n\
    \    type: elasticsearch\n    inputs:\n    - topic_routes.zeek_dns\n    endpoints:\n\
    \    - https://soc.opensearch.svc.cluster.local:9200\n    api_version: v7\n  \
    \  mode: bulk\n    bulk:\n      action: index\n      index: zeek-dns-%Y.%m.%d\n\
    \    auth:\n      strategy: basic\n      user: soc-indexer\n      password: ${OPENSEARCH_PASSWORD}\n\
    \    tls:\n      ca_file: /etc/opensearch-ca/ca.crt\n      verify_certificate:\
    \ true\n      verify_hostname: true\n    compression: none\n    buffer:\n    \
    \  type: disk\n      max_size: 268435488\n      when_full: block\n    acknowledgements:\n\
    \      enabled: true\n    healthcheck:\n      enabled: true\n    suppress_type_name:\
    \ true\n    request_retry_partial: true\n  zeek_http:\n    type: elasticsearch\n\
    \    inputs:\n    - topic_routes.zeek_http\n    endpoints:\n    - https://soc.opensearch.svc.cluster.local:9200\n\
    \    api_version: v7\n    mode: bulk\n    bulk:\n      action: index\n      index:\
    \ zeek-http-%Y.%m.%d\n    auth:\n      strategy: basic\n      user: soc-indexer\n\
    \      password: ${OPENSEARCH_PASSWORD}\n    tls:\n      ca_file: /etc/opensearch-ca/ca.crt\n\
    \      verify_certificate: true\n      verify_hostname: true\n    compression:\
    \ none\n    buffer:\n      type: disk\n      max_size: 268435488\n      when_full:\
    \ block\n    acknowledgements:\n      enabled: true\n    healthcheck:\n      enabled:\
    \ true\n    suppress_type_name: true\n    request_retry_partial: true\n  zeek_notice:\n\
    \    type: elasticsearch\n    inputs:\n    - topic_routes.zeek_notice\n    endpoints:\n\
    \    - https://soc.opensearch.svc.cluster.local:9200\n    api_version: v7\n  \
    \  mode: bulk\n    bulk:\n      action: index\n      index: zeek-notice-%Y.%m.%d\n\
    \    auth:\n      strategy: basic\n      user: soc-indexer\n      password: ${OPENSEARCH_PASSWORD}\n\
    \    tls:\n      ca_file: /etc/opensearch-ca/ca.crt\n      verify_certificate:\
    \ true\n      verify_hostname: true\n    compression: none\n    buffer:\n    \
    \  type: disk\n      max_size: 268435488\n      when_full: block\n    acknowledgements:\n\
    \      enabled: true\n    healthcheck:\n      enabled: true\n    suppress_type_name:\
    \ true\n    request_retry_partial: true\n  zeek_intel:\n    type: elasticsearch\n\
    \    inputs:\n    - topic_routes.zeek_intel\n    endpoints:\n    - https://soc.opensearch.svc.cluster.local:9200\n\
    \    api_version: v7\n    mode: bulk\n    bulk:\n      action: index\n      index:\
    \ zeek-intel-%Y.%m.%d\n    auth:\n      strategy: basic\n      user: soc-indexer\n\
    \      password: ${OPENSEARCH_PASSWORD}\n    tls:\n      ca_file: /etc/opensearch-ca/ca.crt\n\
    \      verify_certificate: true\n      verify_hostname: true\n    compression:\
    \ none\n    buffer:\n      type: disk\n      max_size: 268435488\n      when_full:\
    \ block\n    acknowledgements:\n      enabled: true\n    healthcheck:\n      enabled:\
    \ true\n    suppress_type_name: true\n    request_retry_partial: true\n  audit_k8s:\n\
    \    type: elasticsearch\n    inputs:\n    - topic_routes.audit_k8s\n    endpoints:\n\
    \    - https://soc.opensearch.svc.cluster.local:9200\n    api_version: v7\n  \
    \  mode: bulk\n    bulk:\n      action: index\n      index: audit-k8s-%Y.%m.%d\n\
    \    auth:\n      strategy: basic\n      user: soc-indexer\n      password: ${OPENSEARCH_PASSWORD}\n\
    \    tls:\n      ca_file: /etc/opensearch-ca/ca.crt\n      verify_certificate:\
    \ true\n      verify_hostname: true\n    compression: none\n    buffer:\n    \
    \  type: disk\n      max_size: 268435488\n      when_full: block\n    acknowledgements:\n\
    \      enabled: true\n    healthcheck:\n      enabled: true\n    suppress_type_name:\
    \ true\n    request_retry_partial: true\n  falco_alerts:\n    type: elasticsearch\n\
    \    inputs:\n    - topic_routes.falco_alerts\n    endpoints:\n    - https://soc.opensearch.svc.cluster.local:9200\n\
    \    api_version: v7\n    mode: bulk\n    bulk:\n      action: index\n      index:\
    \ falco-alerts-%Y.%m.%d\n    auth:\n      strategy: basic\n      user: soc-indexer\n\
    \      password: ${OPENSEARCH_PASSWORD}\n    tls:\n      ca_file: /etc/opensearch-ca/ca.crt\n\
    \      verify_certificate: true\n      verify_hostname: true\n    compression:\
    \ none\n    buffer:\n      type: disk\n      max_size: 268435488\n      when_full:\
    \ block\n    acknowledgements:\n      enabled: true\n    healthcheck:\n      enabled:\
    \ true\n    suppress_type_name: true\n    request_retry_partial: true\ntests:\n\
    - name: audit managedFields dot keys removed\n  inputs:\n  - insert_at: index_route\n\
    \    type: log\n    log_fields:\n      kafka_topic: audit-k8s\n      requestObject:\n\
    \        metadata:\n          managedFields:\n          - fieldsV1:\n        \
    \      '.': {}\n        roleRef:\n          name: cluster-admin\n      responseObject:\n\
    \        metadata:\n          managedFields:\n          - fieldsV1:\n        \
    \      '.': {}\n  outputs:\n  - extract_from: index_route\n    conditions:\n \
    \   - type: vrl\n      source: '!exists(.requestObject) && !exists(.responseObject)\
    \ && contains!(.request_object_json, \"cluster-admin\") && contains!(.response_object_json,\
    \ \"fieldsV1\")'\n- name: audit daily prefix\n  inputs:\n  - insert_at: index_route\n\
    \    type: log\n    log_fields:\n      kafka_topic: audit-k8s\n      auditID:\
    \ test\n  outputs:\n  - extract_from: index_route\n    conditions:\n    - type:\
    \ vrl\n      source: .index_prefix == \"audit-k8s\" && exists(.\"@timestamp\"\
    )\n- name: topic route zeek-conn\n  inputs:\n  - insert_at: topic_routes\n   \
    \ type: log\n    log_fields:\n      kafka_topic: zeek-conn\n  outputs:\n  - extract_from:\
    \ topic_routes.zeek_conn\n    conditions:\n    - type: vrl\n      source: .kafka_topic\
    \ == \"zeek-conn\"\n- name: topic route zeek-dns\n  inputs:\n  - insert_at: topic_routes\n\
    \    type: log\n    log_fields:\n      kafka_topic: zeek-dns\n  outputs:\n  -\
    \ extract_from: topic_routes.zeek_dns\n    conditions:\n    - type: vrl\n    \
    \  source: .kafka_topic == \"zeek-dns\"\n- name: topic route zeek-http\n  inputs:\n\
    \  - insert_at: topic_routes\n    type: log\n    log_fields:\n      kafka_topic:\
    \ zeek-http\n  outputs:\n  - extract_from: topic_routes.zeek_http\n    conditions:\n\
    \    - type: vrl\n      source: .kafka_topic == \"zeek-http\"\n- name: topic route\
    \ zeek-notice\n  inputs:\n  - insert_at: topic_routes\n    type: log\n    log_fields:\n\
    \      kafka_topic: zeek-notice\n  outputs:\n  - extract_from: topic_routes.zeek_notice\n\
    \    conditions:\n    - type: vrl\n      source: .kafka_topic == \"zeek-notice\"\
    \n- name: topic route zeek-intel\n  inputs:\n  - insert_at: topic_routes\n   \
    \ type: log\n    log_fields:\n      kafka_topic: zeek-intel\n  outputs:\n  - extract_from:\
    \ topic_routes.zeek_intel\n    conditions:\n    - type: vrl\n      source: .kafka_topic\
    \ == \"zeek-intel\"\n- name: topic route audit-k8s\n  inputs:\n  - insert_at:\
    \ topic_routes\n    type: log\n    log_fields:\n      kafka_topic: audit-k8s\n\
    \  outputs:\n  - extract_from: topic_routes.audit_k8s\n    conditions:\n    -\
    \ type: vrl\n      source: .kafka_topic == \"audit-k8s\"\n- name: topic route\
    \ falco-alerts\n  inputs:\n  - insert_at: topic_routes\n    type: log\n    log_fields:\n\
    \      kafka_topic: falco-alerts\n  outputs:\n  - extract_from: topic_routes.falco_alerts\n\
    \    conditions:\n    - type: vrl\n      source: .kafka_topic == \"falco-alerts\"\
    \n"
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vector-indexer
  namespace: kafka
spec:
  selector:
    matchLabels:
      app: vector-indexer
  template:
    metadata:
      labels:
        app: vector-indexer
      annotations:
        soc.lab/config-sha256: 5d7517d3cafe4e230249ce324f620eb66794be41f82f601e78d8ab5e7bb06540
    spec:
      automountServiceAccountToken: false
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
      - name: vector
        image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
        args:
        - --dangerously-allow-env-var-interpolation
        - --config
        - /etc/vector/vector.yaml
        env:
        - name: VECTOR_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: soc-indexer
              key: password
        - name: OPENSEARCH_PASSWORD
          valueFrom:
            secretKeyRef:
              name: soc-opensearch-indexer
              key: password
        resources:
          requests:
            memory: 512Mi
            cpu: 50m
          limits:
            memory: 1Gi
            cpu: 500m
        securityContext:
          runAsUser: 1000
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: api
          containerPort: 8686
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
        - name: kafka-ca
          mountPath: /etc/kafka-ca
          readOnly: true
        - name: data
          mountPath: /var/lib/vector
        - name: opensearch-ca
          mountPath: /etc/opensearch-ca
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: vector-indexer
      - name: kafka-ca
        secret:
          secretName: soc-cluster-ca-cert
          items:
          - key: ca.crt
            path: ca.crt
      - name: opensearch-ca
        secret:
          secretName: soc-opensearch-ca
      - name: data
        persistentVolumeClaim:
          claimName: vector-indexer-buffer
      securityContext:
        fsGroup: 1000
  replicas: 1
  strategy:
    type: Recreate
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vector-indexer-buffer
  namespace: kafka
spec:
  accessModes:
  - ReadWriteOnce
  storageClassName: local-path
  resources:
    requests:
      storage: 3Gi
