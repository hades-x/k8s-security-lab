apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-zeek
  namespace: kafka
data:
  vector.yaml: "data_dir: /var/lib/vector\napi:\n  enabled: true\n  address: 0.0.0.0:8686\n\
    sources:\n  zeek:\n    type: file\n    include:\n    - /var/log/zeek/current/*.log\n\
    \    read_from: beginning\n    max_line_bytes: 1048576\ntransforms:\n  parse_zeek:\n\
    \    type: remap\n    inputs:\n    - zeek\n    drop_on_error: true\n    drop_on_abort:\
    \ true\n    source: 'file = string!(.file)\n\n      . = object!(parse_json!(string!(.message)))\n\
    \n      parts = split(file, \"/\")\n\n      .log_type = replace(string!(parts[-1]),\
    \ r''\\.log$'', \"\")\n\n      if !includes([\"conn\", \"dns\", \"http\", \"notice\"\
    , \"intel\"], .log_type) { abort\n      }\n\n      .node = get_env_var!(\"VECTOR_NODE_NAME\"\
    )\n\n      .sensor = \"zeek-\" + .node\n\n      if exists(.id) && !is_object(.id)\
    \ { .zeek_id = del(.id) }\n\n      # Zeek''s JSON keys are dotted: normalize into\
    \ an id object for IP mappings.\n\n      if exists(.\"id.orig_h\") { .id.orig_h\
    \ = del(.\"id.orig_h\") }\n\n      if exists(.\"id.resp_h\") { .id.resp_h = del(.\"\
    id.resp_h\") }\n\n      if exists(.\"id.orig_p\") { .id.orig_p = del(.\"id.orig_p\"\
    ) }\n\n      if exists(.\"id.resp_p\") { .id.resp_p = del(.\"id.resp_p\") }\n\n\
    \      .\"@timestamp\" = from_unix_timestamp!(to_int(to_float!(.ts) * 1000.0),\
    \ unit:\n      \"milliseconds\")\n\n      '\nsinks:\n  kafka:\n    type: kafka\n\
    \    inputs:\n    - parse_zeek\n    bootstrap_servers: soc-kafka-bootstrap.kafka.svc.cluster.local:9093\n\
    \    sasl:\n      enabled: true\n      mechanism: SCRAM-SHA-512\n      username:\
    \ zeek-shipper\n      password: ${KAFKA_PASSWORD}\n    tls:\n      enabled: true\n\
    \      ca_file: /etc/kafka-ca/ca.crt\n      verify_certificate: true\n      verify_hostname:\
    \ true\n    topic: zeek-{{ log_type }}\n    encoding:\n      codec: json\n   \
    \ compression: lz4\n    librdkafka_options:\n      enable.idempotence: 'false'\n\
    \      acks: all\n      message.timeout.ms: '300000'\n      queue.buffering.max.kbytes:\
    \ '16384'\n      queue.buffering.max.messages: '10000'\n    buffer:\n      type:\
    \ disk\n      max_size: 268435488\n      when_full: block\n    acknowledgements:\n\
    \      enabled: true\ntests:\n- name: conn dotted IP mapping\n  inputs:\n  - insert_at:\
    \ parse_zeek\n    type: log\n    log_fields:\n      file: /var/log/zeek/current/conn.log\n\
    \      message: '{\"ts\": 1760000000.125, \"uid\": \"C1\", \"id.orig_h\": \"192.168.150.11\"\
    ,\n        \"id.resp_h\": \"192.168.150.12\", \"id.orig_p\": 12345, \"id.resp_p\"\
    : 443}'\n  outputs:\n  - extract_from: parse_zeek\n    conditions:\n    - type:\
    \ vrl\n      source: .log_type == \"conn\" && .id.orig_h == \"192.168.150.11\"\
    \ && .id.orig_p\n        == 12345 && .node == \"validation-node\"\n- name: scalar\
    \ intel id renamed\n  inputs:\n  - insert_at: parse_zeek\n    type: log\n    log_fields:\n\
    \      file: /var/log/zeek/current/intel.log\n      message: '{\"ts\":1760000000,\"\
    id\":\"misp-42\"}'\n  outputs:\n  - extract_from: parse_zeek\n    conditions:\n\
    \    - type: vrl\n      source: .zeek_id == \"misp-42\" && !exists(.id) && .log_type\
    \ == \"intel\"\n- name: unknown log dropped\n  inputs:\n  - insert_at: parse_zeek\n\
    \    type: log\n    log_fields:\n      file: /var/log/zeek/current/files.log\n\
    \      message: '{\"ts\":1760000000}'\n  no_outputs_from:\n  - parse_zeek\n- name:\
    \ Malformed JSON dropped\n  inputs:\n  - insert_at: parse_zeek\n    type: log\n\
    \    log_fields:\n      file: /var/log/zeek/current/conn.log\n      message: not-json\n\
    \  no_outputs_from:\n  - parse_zeek\n"
---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: vector-zeek
  namespace: kafka
spec:
  selector:
    matchLabels:
      app: vector-zeek
  template:
    metadata:
      labels:
        app: vector-zeek
      annotations:
        soc.lab/config-sha256: c41de3341463559d0d5e3f6052d8a89da38e95ea6ef5d44adf9d743243973a43
    spec:
      automountServiceAccountToken: false
      tolerations:
      - key: node-role.kubernetes.io/control-plane
        operator: Exists
        effect: NoSchedule
      - key: node-role.kubernetes.io/master
        operator: Exists
        effect: NoSchedule
      terminationGracePeriodSeconds: 60
      containers:
      - name: vector
        image: timberio/vector:0.59.0-alpine@sha256:0e36bc2a290039e9b6a5e92f04bd2f133223506f72d09682c1df16c015172b7a
        args:
        - --dangerously-allow-env-var-interpolation
        - --config
        - /etc/vector/vector.yaml
        env:
        - name: VECTOR_NODE_NAME
          valueFrom:
            fieldRef:
              fieldPath: spec.nodeName
        - name: KAFKA_PASSWORD
          valueFrom:
            secretKeyRef:
              name: zeek-shipper
              key: password
        resources:
          requests:
            memory: 64Mi
            cpu: 25m
          limits:
            memory: 192Mi
            cpu: 300m
        securityContext:
          runAsUser: 0
          allowPrivilegeEscalation: false
          capabilities:
            drop:
            - ALL
        ports:
        - name: api
          containerPort: 8686
        livenessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 30
          periodSeconds: 15
        readinessProbe:
          httpGet:
            path: /health
            port: api
          initialDelaySeconds: 5
          periodSeconds: 10
        volumeMounts:
        - name: config
          mountPath: /etc/vector
          readOnly: true
        - name: kafka-ca
          mountPath: /etc/kafka-ca
          readOnly: true
        - name: data
          mountPath: /var/lib/vector
        - name: logs
          mountPath: /var/log/zeek
          readOnly: true
      volumes:
      - name: config
        configMap:
          name: vector-zeek
      - name: kafka-ca
        secret:
          secretName: soc-cluster-ca-cert
          items:
          - key: ca.crt
            path: ca.crt
      - name: logs
        hostPath:
          path: /var/log/zeek
          type: DirectoryOrCreate
      - name: data
        hostPath:
          path: /var/lib/vector-soc/zeek
          type: DirectoryOrCreate
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: vector-audit
  namespace: kafka
data:
  vector.yaml: "data_dir: /var/lib/vector\napi:\n  enabled: true\n  address: 0.0.0.0:8686\n\
    sources:\n  audit:\n    type: file\n    include:\n    - /var/lib/rancher/k3s/server/logs/audit.log\n\
    \    read_from: beginning\n    max_line_bytes: 4194304\ntransforms:\n  parse_audit:\n\
    \    type: remap\n    inputs:\n    - audit\n    drop_on_error: true\n    source:\
    \ \" . = object!(parse_json!(string!(.message)))\\nif .objectRef.resource\\\n\
    \      \\ == \\\"secrets\\\" {\\n  del(.requestObject)\\n  del(.responseObject)\\\
    n}\\n.node\\\n      \\ = get_env_var!(\\\"VECTOR_NODE_NAME\\\")\\n.sensor = \\\
    \"k3s-audit-\\\" + .node\\n.log_type\\\n      \\ = \\\"audit-k8s\\\"\\n.\\\"@timestamp\\\
    \" = parse_timestamp!(string!(.requestReceivedTimestamp),\\\n      \\ format:\
    \ \\\"%+\\\")\\n\"\n  reduce_noise:\n    type: filter\n    inputs:\n    - parse_audit\n\
    \    condition:\n      type: vrl\n      source: 'v = to_string(.verb) ?? \"\"\n\
    \n        u = to_string(.user.username) ?? \"\"\n\n        r = to_string(.objectRef.resource)\
    \ ?? \"\"\n\n        s = exists(.objectRef.subresource)\n\n        !includes([\"\
    get\",\"list\",\"watch\"], v) || r == \"secrets\" || s || u == \"system:anonymous\"\
    \n        || !starts_with(u, \"system:\")'\nsinks:\n  kafka:\n    type: kafka\n\
    \    inputs:\n    - reduce_noise\n    bootstrap_servers: soc-kafka-bootstrap.kafka.svc.cluster.local:9093\n\
    \    sasl:\n      enabled: true\n      mechanism: SCRAM-SHA-512\n      username:\
    \ audit-shipper\n      password: ${KAFKA_PASSWORD}\n    tls:\n      enabled: true\n\
    \      ca_file: /etc/kafka-ca/ca.crt\n      verify_certificate: true\n      verify_hostname:\
    \ true\n    topic: audit-k8s\n    encoding:\n      codec: json\n    compression:\
    \ lz4\n    librdkafka_options:\n      enable.idempotence: 'false'\n      acks:\
    \ all\n      message.timeout.ms: '300000'\n      queue.buffering.max.kbytes: '16384'\n\
    \      queue.buffering.max.messages: '10000'\n    buffer:\n      type: disk\n\
    \      max_size: 268435488\n      when_full: block\n    acknowledgements:\n  \
    \    enabled: true\ntests:\n- name: Secret objects removed\n  inputs:\n  - insert_at:\
    \ parse_audit\n    type: log\n    log_fields:\n      message: '{\"objectRef\"\
    :{\"resource\":\"secrets\"},\"requestObject\":{\"data\":{\"x\":\"redact-me\"}},\"\
    responseObject\":{\"data\":{\"x\":\"redact-me\"}},\"requestReceivedTimestamp\"\
    :\"2026-10-13T07:00:00Z\"}'\n  outputs:\n  - extract_from: parse_audit\n    conditions:\n\
    \    - type: vrl\n      source: '!exists(.requestObject) && !exists(.responseObject)\
    \ && .log_type ==\n        \"audit-k8s\"'\n- name: Non-secret request objects\
    \ retained\n  inputs:\n  - insert_at: parse_audit\n    type: log\n    log_fields:\n\
    \      message: '{\"objectRef\":{\"resource\":\"pods\"},\"requestObject\":{\"\
    data\":{\"x\":\"redact-me\"}},\"responseObject\":{\"data\":{\"x\":\"redact-me\"\
    }},\"requestReceivedTimestamp\":\"2026-10-13T07:00:00Z\"}'\n  outputs:\n  - extract_from:\
    \ parse_audit\n    conditions:\n    - type: vrl\n      source: exists(.requestObject)\
    \ && exists(.responseObject)\n"
---
