data_dir: /var/lib/vector
api:
  enabled: true
  address: 0.0.0.0:8686
sources:
  audit:
    type: file
    include:
    - /var/lib/rancher/k3s/server/logs/audit.log
    read_from: beginning
    max_line_bytes: 4194304
transforms:
  parse_audit:
    type: remap
    inputs:
    - audit
    drop_on_error: true
    source: " . = object!(parse_json!(string!(.message)))\nif .objectRef.resource\
      \ == \"secrets\" {\n  del(.requestObject)\n  del(.responseObject)\n}\n.node\
      \ = get_env_var!(\"VECTOR_NODE_NAME\")\n.sensor = \"k3s-audit-\" + .node\n.log_type\
      \ = \"audit-k8s\"\n.\"@timestamp\" = parse_timestamp!(string!(.requestReceivedTimestamp),\
      \ format: \"%+\")\n"
  reduce_noise:
    type: filter
    inputs:
    - parse_audit
    condition:
      type: vrl
      source: 'v = to_string(.verb) ?? ""

        u = to_string(.user.username) ?? ""

        r = to_string(.objectRef.resource) ?? ""

        s = exists(.objectRef.subresource)

        !includes(["get","list","watch"], v) || r == "secrets" || s || u == "system:anonymous"
        || !starts_with(u, "system:")'
sinks:
  kafka:
    type: kafka
    inputs:
    - reduce_noise
    bootstrap_servers: soc-kafka-bootstrap.kafka.svc.cluster.local:9093
    sasl:
      enabled: true
      mechanism: SCRAM-SHA-512
      username: audit-shipper
      password: ${KAFKA_PASSWORD}
    tls:
      enabled: true
      ca_file: /etc/kafka-ca/ca.crt
      verify_certificate: true
      verify_hostname: true
    topic: audit-k8s
    encoding:
      codec: json
    compression: lz4
    librdkafka_options:
      enable.idempotence: 'false'
      acks: all
      message.timeout.ms: '300000'
      queue.buffering.max.kbytes: '16384'
      queue.buffering.max.messages: '10000'
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    acknowledgements:
      enabled: true
tests:
- name: Secret objects removed
  inputs:
  - insert_at: parse_audit
    type: log
    log_fields:
      message: '{"objectRef":{"resource":"secrets"},"requestObject":{"data":{"x":"redact-me"}},"responseObject":{"data":{"x":"redact-me"}},"requestReceivedTimestamp":"2026-10-13T07:00:00Z"}'
  outputs:
  - extract_from: parse_audit
    conditions:
    - type: vrl
      source: '!exists(.requestObject) && !exists(.responseObject) && .log_type ==
        "audit-k8s"'
- name: Non-secret request objects retained
  inputs:
  - insert_at: parse_audit
    type: log
    log_fields:
      message: '{"objectRef":{"resource":"pods"},"requestObject":{"data":{"x":"redact-me"}},"responseObject":{"data":{"x":"redact-me"}},"requestReceivedTimestamp":"2026-10-13T07:00:00Z"}'
  outputs:
  - extract_from: parse_audit
    conditions:
    - type: vrl
      source: exists(.requestObject) && exists(.responseObject)
