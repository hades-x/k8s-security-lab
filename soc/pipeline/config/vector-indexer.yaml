tests:
- name: audit managedFields dot keys removed
  inputs:
  - insert_at: index_route
    type: log
    log_fields:
      kafka_topic: audit-k8s
      requestObject:
        metadata:
          managedFields:
          - fieldsV1:
              '.': {}
        roleRef:
          name: cluster-admin
      responseObject:
        metadata:
          managedFields:
          - fieldsV1:
              '.': {}
  outputs:
  - extract_from: index_route
    conditions:
    - type: vrl
      source: '!exists(.requestObject) && !exists(.responseObject) && contains!(.request_object_json, "cluster-admin") && contains!(.response_object_json, "fieldsV1")'
- name: audit daily prefix
  inputs:
  - insert_at: index_route
    type: log
    log_fields:
      kafka_topic: audit-k8s
      auditID: test
  outputs:
  - extract_from: index_route
    conditions:
    - type: vrl
      source: .index_prefix == "audit-k8s" && exists(."@timestamp")
- name: topic route zeek-conn
  inputs:
  - insert_at: topic_routes
    type: log
    log_fields:
      kafka_topic: zeek-conn
  outputs:
  - extract_from: topic_routes.zeek_conn
    conditions:
    - type: vrl
      source: .kafka_topic == "zeek-conn"
- name: topic route zeek-dns
