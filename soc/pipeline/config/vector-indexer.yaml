data_dir: /var/lib/vector
api:
  enabled: true
  address: 0.0.0.0:8686
sources:
  kafka:
    type: kafka
    bootstrap_servers: soc-kafka-bootstrap.kafka.svc.cluster.local:9093
    sasl:
      enabled: true
      mechanism: SCRAM-SHA-512
      username: soc-indexer
      password: ${KAFKA_PASSWORD}
    tls:
      enabled: true
      ca_file: /etc/kafka-ca/ca.crt
      verify_certificate: true
      verify_hostname: true
    group_id: soc-indexer
    topics:
    - zeek-conn
    - zeek-dns
    - zeek-http
    - zeek-notice
    - zeek-intel
    - audit-k8s
    - falco-alerts
    auto_offset_reset: earliest
    topic_key: kafka_topic
    decoding:
      codec: json
    librdkafka_options:
      auto.commit.interval.ms: '1000'
      queued.max.messages.kbytes: '32768'
      fetch.message.max.bytes: '1048576'
transforms:
  index_route:
    type: remap
    inputs:
    - kafka
    drop_on_error: true
    drop_on_abort: true
    source: |
      topic = string!(.kafka_topic)
      if !includes(["zeek-conn", "zeek-dns", "zeek-http", "zeek-notice", "zeek-intel",
                    "audit-k8s", "falco-alerts"], topic) { abort }
      .index_prefix = topic
      # Arbitrary audit bodies have incompatible dotted label/FieldsV1 keys.
      # Preserve non-secret bodies as JSON strings, not dynamic mapping trees.
      if topic == "audit-k8s" {
        if .objectRef.resource == "secrets" {
          del(.requestObject)
          del(.responseObject)
        } else {
          if exists(.requestObject) { .request_object_json = encode_json(del(.requestObject)) }
          if exists(.responseObject) { .response_object_json = encode_json(del(.responseObject)) }
        }
      }
      if !exists(."@timestamp") { ."@timestamp" = now() }
  topic_routes:
    type: route
    inputs:
    - index_route
    route:
      zeek_conn: .kafka_topic == "zeek-conn"
      zeek_dns: .kafka_topic == "zeek-dns"
      zeek_http: .kafka_topic == "zeek-http"
      zeek_notice: .kafka_topic == "zeek-notice"
      zeek_intel: .kafka_topic == "zeek-intel"
      audit_k8s: .kafka_topic == "audit-k8s"
      falco_alerts: .kafka_topic == "falco-alerts"
sinks:
  zeek_conn:
    type: elasticsearch
    inputs:
    - topic_routes.zeek_conn
    endpoints:
    - https://soc.opensearch.svc.cluster.local:9200
    api_version: v7
    mode: bulk
    bulk:
      action: index
      index: zeek-conn-%Y.%m.%d
    auth:
      strategy: basic
      user: soc-indexer
      password: ${OPENSEARCH_PASSWORD}
    tls:
      ca_file: /etc/opensearch-ca/ca.crt
      verify_certificate: true
      verify_hostname: true
    compression: none
    buffer:
      type: disk
      max_size: 268435488
      when_full: block
    acknowledgements:
      enabled: true
    healthcheck:
      enabled: true
    suppress_type_name: true
    request_retry_partial: true
